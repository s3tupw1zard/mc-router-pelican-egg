name: Build and publish image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint.sh
      - .github/workflows/docker.yml
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      mc_router_version:
        description: "mc-router version to build (for example 1.47.1 or v1.47.1). Leave empty for latest."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve mc-router version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.mc_router_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            version="${REQUESTED_VERSION#v}"
          else
            version="$(
              curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/itzg/mc-router/releases/latest \
              | jq -r '.tag_name' \
              | sed 's/^v//'
            )"
          fi

          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "Could not resolve an mc-router version." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building mc-router ${version}"

  build:
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=mc-router-${{ needs.resolve-version.outputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=mc-router Pelican image
            org.opencontainers.image.description=Pelican-compatible runtime image for itzg/mc-router
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.s3tupw1zard.mc-router.version=${{ needs.resolve-version.outputs.version }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MC_ROUTER_VERSION=${{ needs.resolve-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
